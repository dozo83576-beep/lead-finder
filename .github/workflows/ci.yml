name: Проверка Lead Finder

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  test:
    name: Unit-тесты и компиляция
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Получить код
        uses: actions/checkout@v6

      - name: Установить Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Установить зависимости
        run: python -m pip install -r requirements.txt

      - name: Запустить тесты
        run: python -m unittest discover -s tests -v

      - name: Проверить компиляцию
        run: python -m compileall lead_finder.py verification.py storage.py app.py outreach.py outreach_integrations.py outreach_worker.py outreach_ui.py crm.py crm_ui.py
